[window]
dynamic_padding = true
decorations = "full"
title = "Alacritty@Gentoo"
opacity = 0.8
decorations_theme_variant = "Dark"

[window.class]
instance = "Alacritty"
general = "Alacritty"

[scrolling]
history = 100000
multiplier = 3

[font]
size = 12

[font.normal]
family = "JetBrainsMono NerdFont Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono NerdFont Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono NerdFont Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono NerdFont Mono"
style = "Bold Italic"

[cursor]
style = "Underline"
vi_mode_style = "None"
unfocused_hollow = true
thickness = 0.15

[mouse]
hide_when_typing = false

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"

[keyboard]
[[keyboard.bindings]]
key = "Paste"
action = "Paste"

[[keyboard.bindings]]
key = "Copy"
action = "Copy"

[[keyboard.bindings]]
key = "L"
mods = "Control"
action = "ClearLogNotice"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "F"
mods = "Control|Shift"
action = "SearchForward"

[[keyboard.bindings]]
key = "B"
mods = "Control|Shift"
action = "SearchBackward"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
mode = "Vi"
action = "ClearSelection"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[general]
import = [
    "~/.config/alacritty/dank-theme.toml",
    "~/.config/alacritty/themes/noctalia.toml",
]
live_config_reload = true
working_directory = "None"
